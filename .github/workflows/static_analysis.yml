name: Static analysis

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Download and run cloc
        run: |
          curl -s https://raw.githubusercontent.com/AlDanial/cloc/master/cloc > cloc
          chmod +x cloc
          ./cloc --version
          ./cloc $(git ls-files)

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Linting with ruff (including import sorting)
        run: |
          # Same pin as the dev extra, so a new ruff release cannot fail a
          # build on its own. Checks everything, not just src/: examples and
          # docs generators are code users copy from.
          pip install "ruff>=0.17,<0.18"
          ruff check .

      - name: Code formatting with ruff
        run: ruff format --check .

      - name: Check statement order
        run: |
          pip install ssort
          ssort --check --diff .

  # The one JavaScript package in the repo. Its formatting had drifted for
  # want of a gate, and `no-unused-vars` catches the class of mistake that let
  # two builders destructure a helper and never call it.
  plotly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plotly
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # The newest release, not the runner's cached one: Astro raises its minimum often.
          check-latest: true

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint and check formatting
        run: npm run lint

      - name: Type-check the declarations
        run: npm run check:types

      - name: Test
        run: npm test

  # pylint and prospector were evaluated and dropped rather than left running
  # with `|| true`: an advisory job nobody can fail is noise, and ruff already
  # covers the rules this project enforces.

name: Static analysis

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Download and run cloc
        run: |
          curl -s https://raw.githubusercontent.com/AlDanial/cloc/master/cloc > cloc
          chmod +x cloc
          ./cloc --version
          ./cloc $(git ls-files)

  black:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Code formatting with black
        run: |
          pip install black "black[jupyter]"
          black --check src/
          black --check tutorials/

  isort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Code formatting with isort
        run: |
          pip install isort
          isort --check src/
          isort --check tutorials/

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Linting with ruff
        run: |
          pip install ruff
          ruff check src/
          ruff check tutorials/

  # Type checking runs in the "Testing" workflow's `typing` job, against the
  # module list in [tool.mypy]. It is a hard gate there, so it is not
  # duplicated here.
  #
  # pylint and prospector were evaluated and dropped rather than left running
  # with `|| true`: an advisory job nobody can fail is noise, and ruff already
  # covers the rules this project enforces.

name: Test Plotly package
on:
  pull_request:
    paths: ["packages/plotly/**", ".github/workflows/testing-plotly.yml"]
  push:
    branches: [main]
    paths: ["packages/plotly/**", ".github/workflows/testing-plotly.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plotly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/plotly/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run check:types && npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run sync:asset && git diff --exit-code -- ../../src/scope_profiler/_assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plotly-browser-results
          path: packages/plotly/test-results

name: Publish PyPI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scope-profiler/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Check if version already published
        id: version-check
        run: |
          PKG_VERSION="$(python -c 'import re; print(re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", open("pyproject.toml").read())[1])')"
          if curl -sf "https://pypi.org/pypi/scope-profiler/$PKG_VERSION/json" >/dev/null; then
            echo "scope-profiler==$PKG_VERSION already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.version-check.outputs.skip != 'true'

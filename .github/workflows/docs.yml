name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed tutorial notebooks, the
# generated command output and the API reference. Built on every push and pull request with the
# shared workflow of max-models/starlight-theme; deployed to GitHub Pages from devel.
# docs/generate_docs_outputs.py runs the MPI examples under mpirun, hence Open MPI.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.6.0
    with:
      apt-packages: "libopenmpi-dev openmpi-bin"
      pre-build: |
        "$DOCS_PYTHON" docs/generate_docs_outputs.py
      smoke-paths: |
        getting-started/installation/index.html
        getting-started/quickstart/index.html
        guide/plot-cli/index.html
        guide/plotly-package/index.html
        reference/api/index.html
        reference/cli/index.html
        tutorials/index.html
        guide/01-getting-started/index.html
        guide/03-visualization/index.html
        guide/03-visualization/1.png
        api/scope_profiler/index.html
        api/scope_profiler/profile_manager/index.html
        figures/cli/gantt_plot.png
        plotly/index.js
        installation.html/index.html

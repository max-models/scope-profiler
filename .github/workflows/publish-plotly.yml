name: Publish packages and deploy docs

on:
  push:
    branches: [main]

jobs:
  publish-python:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scope-profiler/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-plotly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Test package
        working-directory: packages/plotly
        run: npm test
      - name: Publish to npm with trusted publishing
        working-directory: packages/plotly
        run: npm publish

  build-docs:
    runs-on: ubuntu-latest
    needs: [publish-python, publish-plotly]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation from released packages
        uses: ./.github/actions/build-docs
        with:
          python-version: "3.10"
          treat-warnings-as-errors: "false"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html/

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

name: Testing

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and smoke-test wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/scope-profiler-wheel"
          "$RUNNER_TEMP/scope-profiler-wheel/bin/python" -m pip install \
            dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/scope-profiler-wheel/bin/python" -c \
            "from importlib.metadata import version; import scope_profiler; assert scope_profiler.__version__ == version('scope-profiler')"
          "$RUNNER_TEMP/scope-profiler-wheel/bin/python" -m scope_profiler --version

  typing:
    name: Type check core public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install ".[dev]"

      - name: Run incremental type check
        run: mypy
  coverage:
    name: Test coverage (floor enforced)
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # One Python only, and it has to be >= 3.12: coverage is measured through
    # PEP 669 monitoring, pinned as core = "sysmon" in [tool.coverage.run].
    # The default C tracer claims the single sys.settrace slot that this
    # project's own recursive tracer and line profiler need, which both hides
    # those code paths from the report and makes their tests fail.

    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12 venv
        run: echo "/opt/venvs/py312/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run the suite under coverage
        run: coverage run -m pytest -q

      # The parallel-HDF5 writer and the MPI finalize path only execute under
      # a launcher, in processes pytest never starts. `coverage run -p` gives
      # each rank its own data file (parallel = true in pyproject.toml), and
      # the combine below folds them into the same report -- otherwise a few
      # hundred statements of h5writer.py look permanently untested.
      - name: Measure the MPI paths under coverage
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
        run: |
          mpirun -n 2 coverage run -p src/scope_profiler/tests/test_mpi.py
          mpirun --oversubscribe -n 3 coverage run -p \
            src/scope_profiler/tests/check_parallel_hdf5.py \
            "$RUNNER_TEMP/coverage-parallel.h5"
          coverage run -p src/scope_profiler/tests/check_mpi_launch.py serial

      - name: Combine the measurements
        run: coverage combine

      # The floor is a ratchet, not a target: raise it when coverage rises,
      # never lower it to make a red build green. It lives in
      # [tool.coverage.report] fail_under in pyproject.toml.
      - name: Enforce the coverage floor
        run: coverage report

      - name: Write the HTML report
        if: always()
        run: coverage html

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  pytest:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            venv: /opt/venvs/py311
          - python-version: "3.12"
            venv: /opt/venvs/py312

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }} venv
        run: echo "${{ matrix.venv }}/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: |
          pytest .

      - name: Test postprocessing
        run: |
          python3 src/scope_profiler/tests/examples.py
          scope-profiler inspect profiling_data.h5 --regions-only --quiet
          scope-profiler plot default profiling_data.h5 --show -o figures
          scope-profiler plot flame_chart profiling_data.h5 --backend plotly --show -o smoke-plots
          scope-profiler plot flame_graph profiling_data.h5 --backend plotly --show -o smoke-plots
          scope-profiler report profiling_data.h5 --show -o smoke-report.html

      - name: Run Python examples
        shell: bash
        run: |
          set -euo pipefail
          for example in \
            examples/ex_aggregation.py \
            examples/ex_callgraph.py \
            examples/ex_class_profiling.py \
            examples/ex_in_memory_results.py \
            examples/ex_json_export.py \
            examples/ex_lazy_setup.py \
            examples/ex_line_profiling.py \
            examples/ex_maxplotlib_plotting.py \
            examples/ex_recursive_profiling.py \
            examples/ex_region_source.py \
            examples/ex_self_recursive_region.py
          do
            echo "Running $example"
            python3 "$example"
          done
          scope-profiler run --quiet -o cli_example.h5 examples/ex_cli_profiling.py
          # The -o extension picks the output format, and each one is read
          # back by a subcommand that consumes it. (`-o *.html` is covered by
          # the report smoke test above and by the unit tests; rendering a
          # report for this recursively traced profile takes minutes.)
          scope-profiler run --quiet -o cli_example.json examples/ex_cli_profiling.py
          scope-profiler run --quiet -o cli_example.json.gz examples/ex_cli_profiling.py
          scope-profiler inspect cli_example.json --regions-only --quiet
          scope-profiler diff cli_example.h5 cli_example.json.gz
          scope-profiler export json cli_example.h5 -o exports --gzip

      # Keep a small baseline/candidate workflow example in CI. Call counts
      # are deterministic on shared runners, so this validates the regression
      # gate without making the job depend on noisy wall-clock timings.
      - name: Check profiling regression budget
        run: |
          scope-profiler run --quiet -o baseline.h5 examples/ex_cli_profiling.py
          scope-profiler run --quiet -o candidate.h5 examples/ex_cli_profiling.py
          scope-profiler check baseline.h5 candidate.h5 \
            --metric calls --max-regression 5

  likwid-smoke:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # LIKWID's marker API needs the msr kernel module. --privileged lets the
      # container load it into the (shared) host kernel, but the container's
      # own rootfs ships no kernel modules at all, so /lib/modules from the
      # host has to be bind-mounted in for modprobe to find it.
      options: --privileged -v /lib/modules:/lib/modules:ro
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            venv: /opt/venvs/py311
          - python-version: "3.12"
            venv: /opt/venvs/py312
    # Container jobs run as root, and Open MPI refuses to launch as root
    # without an explicit opt-in. Fine in this throwaway CI container.
    env:
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }} venv
        run: echo "${{ matrix.venv }}/bin" >> "$GITHUB_PATH"

      - name: Load msr kernel module
        run: modprobe msr

      - name: Verify pylikwid import
        run: |
          python3 -c "import pylikwid"

      - name: Test likwid-mpirun
        run: |
          likwid-perfctr -a
          likwid-mpirun -h
          likwid-mpirun -n 1 -g FLOPS_SP -mpi openmpi -stats python3 -c "import pylikwid"

      - name: Test pylikwid readme example
        run: |
          likwid-mpirun -n 1 -g FLOPS_SP -mpi openmpi -stats -marker python3 src/scope_profiler/tests/pylikwid_readme.py

  likwid-examples:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged -v /lib/modules:/lib/modules:ro
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            venv: /opt/venvs/py311
          - python-version: "3.12"
            venv: /opt/venvs/py312
    # Container jobs run as root, and Open MPI refuses to launch as root
    # without an explicit opt-in. Fine in this throwaway CI container.
    env:
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }} venv
        run: echo "${{ matrix.venv }}/bin" >> "$GITHUB_PATH"

      - name: Load msr kernel module
        run: modprobe msr

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      # examples_pylikwid.py asserts that the hardware counters actually reach
      # the HDF5 file, so these runs cover the whole marker -> h5 path. Serial
      # first, to keep a LIKWID failure distinguishable from an MPI one.
      - name: Test examples with pylikwid (serial)
        run: |
          likwid-perfctr -C 0 -g FLOPS_SP -m python3 src/scope_profiler/tests/examples_pylikwid.py

      - name: Test examples with pylikwid (MPI)
        run: |
          likwid-mpirun -n 2 -g FLOPS_SP -mpi openmpi -stats -marker python3 src/scope_profiler/tests/examples_pylikwid.py

      - name: Test LIKWID example
        run: |
          likwid-perfctr -C 0 -g FLOPS_DP -m python3 examples/ex_likwid.py

  fortran:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            venv: /opt/venvs/py311
          - python-version: "3.12"
            venv: /opt/venvs/py312

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }} venv
        run: echo "${{ matrix.venv }}/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      # The Fortran tests in the pytest suite already compile and run the
      # module (gfortran ships in the image). This adds the path a user
      # actually takes: the shipped Makefile, then the importer, on a
      # platform whose clock ids differ from macOS's.
      - name: Test Fortran API (build, run, import)
        run: |
          gfortran --version
          make -C src/scope_profiler/fortran run BUILD_DIR=$PWD/fortran_build
          scope-profiler inspect fortran_build/profiling_data.h5

      # examples/fortran is what users copy from: build both the standalone
      # program and the f2py extension, and run the mixed-language driver.
      - name: Test Fortran examples
        run: |
          make -C examples/fortran run-standalone BUILD_DIR=$PWD/example_build
          make -C examples/fortran run-mixed

  c:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            venv: /opt/venvs/py311
          - python-version: "3.12"
            venv: /opt/venvs/py312

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }} venv
        run: echo "${{ matrix.venv }}/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      # The C API shares the trace format with the Fortran one, and its clock
      # selection differs per platform -- so build and run it on Linux too.
      - name: Test C API (build, run, import)
        run: |
          cc --version
          make -C src/scope_profiler/c run BUILD_DIR=$PWD/c_build
          scope-profiler inspect c_build/profiling_data.h5

      - name: Test C examples
        run: |
          make -C examples/c run-standalone BUILD_DIR=$PWD/c_example_build
          make -C examples/c run-mixed

  mpi:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            venv: /opt/venvs/py311
          - python-version: "3.12"
            venv: /opt/venvs/py312
    # Container jobs run as root, and Open MPI refuses to launch as root
    # without an explicit opt-in. Fine in this throwaway CI container.
    env:
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }} venv
        run: echo "${{ matrix.venv }}/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      # Older cached revisions of the CI image may predate the parallel-h5py
      # build below. Keep pull requests self-contained; the fast path is a
      # single import check once the refreshed image is in use.
      - name: Ensure h5py has parallel HDF5 support
        run: |
          if ! python3 -c "import h5py, sys; sys.exit(not h5py.get_config().mpi)"; then
            apt-get update
            apt-get install -y --no-install-recommends libhdf5-openmpi-dev pkg-config
            HDF5_MPI=ON CC=mpicc pip install \
              --force-reinstall --no-deps --no-binary=h5py h5py
          fi

      # mpi4py is installed at this point (via the dev extra), so the only
      # difference between these runs is the launcher: MPI must be used when
      # started by mpirun and never touched otherwise.
      - name: Test MPI launcher detection (without mpirun)
        run: |
          python3 src/scope_profiler/tests/check_mpi_launch.py serial

      - name: Test MPI launcher detection (with mpirun)
        run: |
          mpirun -n 2 python3 src/scope_profiler/tests/check_mpi_launch.py mpi 2

      - name: Test MPI launcher detection (mpirun, SCOPE_PROFILER_MPI=0)
        run: |
          SCOPE_PROFILER_MPI=0 mpirun -n 1 -x SCOPE_PROFILER_MPI \
            python3 src/scope_profiler/tests/check_mpi_launch.py serial

      - name: Test postprocessing (MPI)
        run: |
          mpirun -n 2 python3 src/scope_profiler/tests/test_mpi.py
          scope-profiler plot default profiling_data.h5 --show -o figures

      # More ranks than the runner has cores, so rank ordering and the
      # collective finalize are exercised with ranks that genuinely contend.
      - name: Test postprocessing (MPI, four ranks)
        run: |
          mpirun --oversubscribe -n 4 python3 src/scope_profiler/tests/test_mpi.py
          scope-profiler inspect profiling_data.h5 --regions-only --quiet

      - name: Test parallel HDF5 writer
        run: |
          python3 -c "import h5py; assert h5py.get_config().mpi"
          # GitHub-hosted/container runners may expose fewer than three Open
          # MPI slots even though the test intentionally exercises 3 ranks.
          mpirun --oversubscribe -n 3 python3 \
            src/scope_profiler/tests/check_parallel_hdf5.py \
            "$RUNNER_TEMP/parallel-profiling-${{ matrix.python-version }}.h5"

  overhead:
    name: Per-call profiling overhead
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/scope-profiler-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12 venv
        run: echo "/opt/venvs/py312/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      # The budgets in test_overhead.py are absolute per-call nanoseconds,
      # deliberately set ~10x above an idle laptop so a loaded shared runner
      # still passes. They catch a structural regression -- an allocation, a
      # lock, a filesystem touch added to the hot path -- not a 2x slowdown.
      # -s prints every measurement plus the summary table, so the trend is
      # readable in the job log even while the gate stays green.
      #
      # Nothing else runs in this job: a parallel test session would compete
      # for the same cores and inflate every number here.
      - name: Measure per-call overhead
        run: pytest -s -m overhead

    # - name: Test tutorials
    #   run: |
    #     jupyter nbconvert --to notebook --execute tutorials/*.ipynb --output-dir=/tmp --ExecutePreprocessor.timeout=300

    # - name: Test docs build
    #   run: |
    #     pip install ".[docs]"
    #     cd docs
    #     make clean
    #     make html
    #     cd ..
    #     ls docs/build/html/index.html

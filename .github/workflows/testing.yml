name: Testing

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Set up Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MPI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install LIKWID
        run: |
          git clone https://github.com/RRZE-HPC/likwid.git
          cd likwid
          make && sudo make install
          sudo modprobe msr
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/likwid.conf
          sudo ldconfig
          likwid-perfctr -a

      - name: Install pylikwid from source
        run: |
          git clone https://github.com/RRZE-HPC/pylikwid.git
          cd pylikwid
          python3 -m pip install --upgrade pip
          python3 -m pip install setuptools
          # Build extension, provide include/lib paths
          python3 setup.py build_ext \
          -I/usr/local/include \
          -L/usr/local/lib \
          -R/usr/local/lib
          # Install it
          python3 setup.py install

      # - name: Install pylikwid from pypi
      #   run: |
      #     python3 -m pip install --upgrade pip
      #     python3 -m pip install setuptools
      #     python3 -m pip install pylikwid

      - name: Verify pylikwid import
        run: |
          python3 -c "import pylikwid"

      - name: Test likwid-mpirun
        run: |
          likwid-perfctr -a
          likwid-mpirun -h
          likwid-mpirun -n 1 -g FLOPS_SP -mpi openmpi -stats python3 -c "import pylikwid"

      - name: Test pylikwid readme example
        run: |
          likwid-mpirun -n 1 -g FLOPS_SP -mpi openmpi -stats -marker python3 src/scope_profiler/tests/pylikwid_readme.py

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: |
          pytest .

      - name: Test postprocessing
        run: |
          python3 src/scope_profiler/tests/examples.py
          scope-profiler plot default profiling_data.h5 --show -o figures

      # The Fortran tests in the suite above already compile and run the
      # module (gfortran ships on the runners). This adds the path a user
      # actually takes: the shipped Makefile, then the importer, on a
      # platform whose clock ids differ from macOS's.
      - name: Test Fortran API (build, run, import)
        run: |
          gfortran --version
          make -C src/scope_profiler/fortran run BUILD_DIR=$PWD/fortran_build
          scope-profiler inspect fortran_build/profiling_data.h5

      # examples/fortran is what users copy from: build both the standalone
      # program and the f2py extension, and run the mixed-language driver.
      - name: Test Fortran examples
        run: |
          make -C examples/fortran run-standalone BUILD_DIR=$PWD/example_build
          make -C examples/fortran run-mixed

      # The C API shares the trace format with the Fortran one, and its clock
      # selection differs per platform -- so build and run it on Linux too.
      - name: Test C API (build, run, import)
        run: |
          cc --version
          make -C src/scope_profiler/c run BUILD_DIR=$PWD/c_build
          scope-profiler inspect c_build/profiling_data.h5

      - name: Test C examples
        run: |
          make -C examples/c run-standalone BUILD_DIR=$PWD/c_example_build
          make -C examples/c run-mixed

      # mpi4py is installed at this point (via the dev extra), so the only
      # difference between these runs is the launcher: MPI must be used when
      # started by mpirun and never touched otherwise.
      - name: Test MPI launcher detection (without mpirun)
        run: |
          python3 src/scope_profiler/tests/check_mpi_launch.py serial

      - name: Test MPI launcher detection (with mpirun)
        run: |
          mpirun -n 2 python3 src/scope_profiler/tests/check_mpi_launch.py mpi 2

      - name: Test MPI launcher detection (mpirun, SCOPE_PROFILER_MPI=0)
        run: |
          SCOPE_PROFILER_MPI=0 mpirun -n 1 -x SCOPE_PROFILER_MPI \
            python3 src/scope_profiler/tests/check_mpi_launch.py serial

      - name: Test postprocessing (MPI)
        run: |
          mpirun -n 2 python3 src/scope_profiler/tests/test_mpi.py
          scope-profiler plot default profiling_data.h5 --show -o figures

      # examples_pylikwid.py asserts that the hardware counters actually reach
      # the HDF5 file, so these runs cover the whole marker -> h5 path. Serial
      # first, to keep a LIKWID failure distinguishable from an MPI one.
      - name: Test examples with pylikwid (serial)
        run: |
          likwid-perfctr -C 0 -g FLOPS_SP -m python3 src/scope_profiler/tests/examples_pylikwid.py

      - name: Test examples with pylikwid (MPI)
        run: |
          likwid-mpirun -n 2 -g FLOPS_SP -mpi openmpi -stats -marker python3 src/scope_profiler/tests/examples_pylikwid.py

      - name: Test LIKWID example
        run: |
          likwid-perfctr -C 0 -g FLOPS_DP -m python3 examples/ex_likwid.py

    # - name: Test tutorials

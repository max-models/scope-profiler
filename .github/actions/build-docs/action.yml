name: "Build Documentation"
description: "Build Sphinx documentation"
inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.10"
  treat-warnings-as-errors:
    description: "Treat warnings as errors (-W flag)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pandoc
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Build the docs against exactly what users can install, not the
        # checkout's source tree. This action runs only after PyPI publishing.
        pip install "scope-profiler[docs]"

    - name: Verify the released npm package
      shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/scope-profiler-plotly" \
          --ignore-scripts --no-audit --no-fund @scope-profiler/plotly

    - name: Build Sphinx docs
      shell: bash
      run: |
        # `html` depends on the separate figures and Markdown generation
        # targets before Sphinx copies the assets and builds the site.
        cd docs
        if [[ "${{ inputs.treat-warnings-as-errors }}" == "true" ]]; then
          make html SPHINXOPTS=-W
        else
          make html
        fi

name: "Build Documentation"
description: "Build Sphinx documentation"
inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.10"
  treat-warnings-as-errors:
    description: "Treat warnings as errors (-W flag)"
    required: false
    default: "false"
  use-released-packages:
    description: "Install the just-published PyPI and npm versions instead of checkout sources."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pandoc
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [[ "${{ inputs.use-released-packages }}" != "true" ]]; then
          pip install ".[docs]"
          exit 0
        fi
        # Build against this commit's PyPI release, not the previously cached
        # latest release. PyPI can take a short time to expose a new wheel, so
        # retry the exact version before letting the docs job fail.
        version="$(python -c 'import re; print(re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", open("pyproject.toml").read())[1])')"
        for attempt in {1..12}; do
          if pip install --upgrade --no-cache-dir "scope-profiler[docs]==$version"; then
            break
          fi
          if [[ "$attempt" == "12" ]]; then
            exit 1
          fi
          sleep 10
        done
        python -c "from importlib.metadata import version as installed; assert installed('scope-profiler') == '$version'"

    - name: Verify the released npm package
      if: inputs.use-released-packages == 'true'
      shell: bash
      run: |
        version="$(node -p 'require("./packages/plotly/package.json").version')"
        for attempt in {1..12}; do
          if npm install --prefix "$RUNNER_TEMP/scope-profiler-plotly" \
            --ignore-scripts --no-audit --no-fund "@scope-profiler/plotly@$version"; then
            break
          fi
          if [[ "$attempt" == "12" ]]; then
            exit 1
          fi
          sleep 10
        done
        installed="$(node -p 'require(process.env.RUNNER_TEMP + "/scope-profiler-plotly/node_modules/@scope-profiler/plotly/package.json").version')"
        [[ "$installed" == "$version" ]]
        mkdir -p docs/source/_static/plotly
        cp "$RUNNER_TEMP/scope-profiler-plotly/node_modules/@scope-profiler/plotly/src/index.js" \
          docs/source/_static/plotly/index.js

    - name: Build Sphinx docs
      shell: bash
      env:
        SCOPE_PROFILER_DOCS_USE_RELEASED_NPM: ${{ inputs.use-released-packages == 'true' && '1' || '' }}
      run: |
        # `html` depends on the separate figures and Markdown generation
        # targets before Sphinx copies the assets and builds the site.
        cd docs
        if [[ "${{ inputs.treat-warnings-as-errors }}" == "true" ]]; then
          make html SPHINXOPTS=-W
        else
          make html
        fi

[pytest]
pythonpath = src
testpaths = src/scope_profiler/tests

# -ra summarises every non-passing outcome, so a skip on a machine without
# MPI/LIKWID/a GPU is visible rather than silently green. The strict flags turn
# a typo in a marker name or an unknown ini key into an error instead of a
# warning that nobody reads.
addopts = -ra --strict-markers --strict-config

markers =
    slow: takes more than a second; deselect with '-m "not slow"'
    needs_mpi: needs a working MPI launcher and mpi4py (name avoids
        colliding with the pytest-mpi plugin's own 'mpi' marker, which
        would silently skip these unless --with-mpi were passed)
    likwid: needs a LIKWID installation and pylikwid
    gpu: needs a CUDA device and a torch/cupy install
    overhead: measures per-call profiling overhead and is timing sensitive

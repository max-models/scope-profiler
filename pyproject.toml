[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "scope-profiler"
version = "0.3.1"
description = "Profile code regions in python, optionally with LIKWID markers."
readme = "README.md"
keywords = [ "python" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "h5py",
  "numpy",
]

optional-dependencies.fortran = [
  # f2py's build backend, for building Fortran kernels into an extension
  # module. The Fortran API itself needs only a compiler.
  "meson",
  "ninja",
]

optional-dependencies.likwid = [
  "pylikwid",
]

optional-dependencies.line-profiler = [
  "line-profiler",
]

optional-dependencies.nvtx = [
  "nvtx",
]

optional-dependencies.mcp = [
  "mcp>=1.6.0,<2.0.0",
]

optional-dependencies.mpi = [
  "mpi4py",
]

optional-dependencies.plot = [
  "ipykernel",
  "jupyterlab",
  "matplotlib",
  "maxplotlibx >= 0.1.6",
  "pandas",
  "snakeviz",
]

optional-dependencies.dev = [
  "black[jupyter]",
  "isort",
  "ruff",
  "scope-profiler[docs,fortran,line-profiler,mcp,mpi,nvtx,plot,test]",
]
# https://medium.com/@pratikdomadiya123/build-project-documentation-quickly-with-the-sphinx-python-2a9732b66594
optional-dependencies.docs = [
  "myst-parser",
  "nbconvert",
  "nbsphinx",
  "pre-commit",
  "pyproject-fmt",
  "sphinx",
  "sphinx-book-theme",
  "scope-profiler[line-profiler,plot]",
]
optional-dependencies.test = [
  "coverage",
  "pytest",
]

optional-dependencies.tui = [
  "tabulate",
  "textual>=0.86",
]
urls."Source" = "https://github.com/max-models/scope-profiler"

scripts.scope-profiler = "scope_profiler.__main__:main"
scripts.scope-profiler-mcp = "scope_profiler.mcp_server.server:main"

[tool.setuptools.packages.find]
where = [ "src" ]

# The native region APIs ship with the wheel: they are source a user compiles
# into their own program, so they have to survive `pip install`.
# native_trace.fortran_source_path() / c_source_path() locate them at run time.
[tool.setuptools.package-data]
scope_profiler = [
  "fortran/*.f90",
  "fortran/Makefile",
  "c/*.c",
  "c/*.h",
  "c/Makefile",
]

[tool.isort]
profile = "black"
